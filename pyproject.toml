    { name = "lymiao99", email = "lymiao99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.0.0",
    "openai>=3.35.1",
